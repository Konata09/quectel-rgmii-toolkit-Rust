# The only source is gnss-ppsd. No other server on purpose: the module has no
# internet.
refclock SOCK /run/gnss-pps.sock refid PPS poll 4 precision 1e-6

driftfile /opt/var/lib/chrony/chrony.drift

# The clock starts wrong at every boot and a fix can come much later.
makestep 1 -1

# chrony stays "synchronised" after losing its source, with only the root
# dispersion growing at 1 ppm. Report stratum 10 once the error bound passes 1 ms
# (about 17 min). activate: never before the first real sync, because the clock
# is wrong at boot and until then clients must see "unsynchronised".
local stratum 10 distance 0.001 activate 0.1

# Serve NTP to the LAN.
allow 192.168.0.0/16
